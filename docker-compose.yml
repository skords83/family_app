version: '3.9'

networks:
  family_net:
    driver: bridge
  proxy:
    external: true

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_organizer
      POSTGRES_USER: family
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - family_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_organizer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/skords83/family-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://family:password@postgres:5432/family_organizer
      CALDAV_URL: ${CALDAV_URL}
      CALDAV_USER: ${CALDAV_USER}
      CALDAV_PASS: ${CALDAV_PASS}
      CARDDAV_URL: ${CARDDAV_URL}
      NORISH_URL: ${NORISH_URL}
      NORISH_API_KEY: ${NORISH_API_KEY}
      IMMICH_URL: ${IMMICH_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      IMMICH_SLIDESHOW_ALBUM_ID: ${IMMICH_SLIDESHOW_ALBUM_ID}
      WEATHER_LAT: ${WEATHER_LAT}
      WEATHER_LON: ${WEATHER_LON}
      WASTE_ICAL_URL: ${WASTE_ICAL_URL}
      ADMIN_PIN: ${ADMIN_PIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-4h}
      SITE_SESSION_EXPIRES_IN: ${SITE_SESSION_EXPIRES_IN:-30d}
      ESP32_DEVICE_KEY: ${ESP32_DEVICE_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      HA_URL: ${HA_URL}
      HA_TOKEN: ${HA_TOKEN}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - family_net
      - proxy
    labels:
      - "traefik.enable=true"

      # ForwardAuth ersetzt Basic-Auth site-weit. /api/auth/* (inkl. nfc-login,
      # poll, claim, login, verify selbst) ist über die Allowlist im verify-Handler
      # öffentlich erreichbar — kein separater Bypass-Router mehr nötig.
      - "traefik.http.routers.family-backend.rule=Host(`family.skords.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.family-backend.entrypoints=websecure"
      - "traefik.http.routers.family-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.family-backend.middlewares=family-forwardauth"
      - "traefik.http.middlewares.family-forwardauth.forwardauth.address=http://backend:3001/api/auth/verify"
      - "traefik.http.middlewares.family-forwardauth.forwardauth.trustForwardHeader=true"

      - "traefik.http.services.family-backend.loadbalancer.server.port=3001"
      - "traefik.docker.network=proxy"

  frontend:
    image: ghcr.io/skords83/family-frontend:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - family_net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.family-frontend.rule=Host(`family.skords.de`)"
      - "traefik.http.routers.family-frontend.entrypoints=websecure"
      - "traefik.http.routers.family-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.family-frontend.middlewares=family-forwardauth"
      - "traefik.http.middlewares.family-forwardauth.forwardauth.address=http://backend:3001/api/auth/verify"
      - "traefik.http.middlewares.family-forwardauth.forwardauth.trustForwardHeader=true"
      - "traefik.http.services.family-frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
